<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/reuseable-design.css">
<title>Tuition Centre System</title>
</head>

<body>

<div class="body">
<div class="content">

    <div class="main">

        <div class="form">

            <div class="main-title">
                Tuition Centre System
            </div>

            <div class="sub-title">
                Assignment Submission Entry
            </div>

            <div id="statusMessage" class="status-message"></div>

            <!-- Row 1 -->
            <div class="stackinputs">

                <label for="SubmissionID">
                    Submission ID <span class="required">*</span>
                    <span class="info-icon" data-info="Auto-generated unique submission identifier.">ⓘ</span>
                </label>

                <div class="id-find-group">
                    <input type="number" id="SubmissionID" required class="short-input" readonly>
                    <div class="mode-toggle" id="modeToggle">
                        <button type="button" class="mode-btn" id="newModeBtn">New</button>
                        <button type="button" class="mode-btn" id="findModeBtn">Find</button>
                    </div>
                </div>

                <div></div>

                <label for="AssignmentID">
                    Assignment <span class="required">*</span>
                    <span class="info-icon" data-info="Select the assignment being submitted.">ⓘ</span>
                </label>

                <div class="user-field-wrapper">
                    <select id="AssignmentID" required>
                        <option value="">--Select Assignment--</option>
                    </select>
                </div>

            </div>

            <!-- Row 2 -->
            <div class="stackinputs">

                <label for="StudentID">
                    Student <span class="required">*</span>
                    <span class="info-icon" data-info="Select the student submitting the assignment.">ⓘ</span>
                </label>

                <div class="user-field-wrapper">
                    <select id="StudentID" required>
                        <option value="">--Select Student--</option>
                    </select>
                </div>

                <div></div>

                <label for="SubmittedDate">
                    Submitted Date <span class="required">*</span>
                    <span class="info-icon" data-info="Date when the assignment was submitted.">ⓘ</span>
                </label>

                <div class="user-field-wrapper">
                    <input type="date" id="SubmittedDate" class="short-input" required>
                </div>

            </div>

            <!-- Row 3 -->
            <div class="stackinputs">

                <label for="Marks">
                    Marks
                    <span class="info-icon" data-info="Marks awarded for this submission (up to 999.99).">ⓘ</span>
                </label>

                <input type="number" id="Marks" class="short-input" min="0" max="999.99" step="0.01" placeholder="0.00">

                <div></div>

                <div></div>
                <div></div>

            </div>

            <div class="button-container">
                <button type="button" class="btn save-btn">Save</button>
                <button type="button" class="btn nav-btn prevButton">◀</button>
                <button type="button" class="btn nav-btn nextButton">▶</button>
                <button type="button" class="btn exit-btn">Exit</button>
            </div>

        </div>

    </div>

</div>
</div>

<script src="js/db-api.js"></script>
<script src="js/assignment-submission.js"></script>

<div class="modal-overlay" id="infoModalOverlay">
    <div class="modal-box">
        <p id="infoModalText"></p>
        <button type="button" id="infoModalClose" class="btn nav-btn">Close</button>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <p id="confirmMessage">Are you sure you want to update this record?</p>
        <div class="modal-buttons">
            <button id="confirmYesBtn" class="btn confirm-yes-btn">Yes</button>
            <button id="confirmNoBtn" class="btn confirm-no-btn">No</button>
        </div>
    </div>
</div>

</body>
</html>
