<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/reuseable-design.css">
    <title>Tuition Centre System</title>
</head>

<body>
    <div class="body">
    <div class="content">
        <div class="main">
            <div class="form">

                <div class="main-title">
                    Tuition Centre System
                </div>

                <div class="sub-title">
                    Audit Log
                </div>

                <div id="statusMessage" class="status-message"></div>

                <!-- Row 1 -->
                <div class="stackinputs">

                    <label for="AuditID" class="assignment-id-label">
                        Audit ID <span class="required">*</span>
                        <span class="info-icon">ⓘ
                            <span class="tooltip">Enter an existing audit ID.</span>
                        </span>
                    </label>

                    <div class="id-find-group">

                        <input class="short-input"
                               type="number"
                               id="AuditID"
                               readonly
                               required>

                        <div class="assignment-mode-toggle">

                            <button type="button"
                                    class="assignment-mode-btn active"
                                    id="newModeBtn">
                                New
                            </button>

                            <button type="button"
                                    class="assignment-mode-btn"
                                    id="findModeBtn">
                                Find
                            </button>

                        </div>

                    </div>

                    <div></div>

                    <label for="UserID">
                        User <span class="required">*</span>
                        <span class="info-icon">ⓘ
                            <span class="tooltip">Select the user this action is attributed to.</span>
                        </span>
                    </label>
                    <div class="assignment-field-wrapper">
                        <select class="short-input" id="UserID" required>
                            <option value="">Select User</option>
                        </select>
                    </div>

                </div>

                <!-- Row 2 -->
                <div class="stackinputs">

                    <label for="Action">
                        Action <span class="required">*</span>
                        <span class="info-icon">ⓘ
                            <span class="tooltip">Enter a description of the action performed (max 100 characters).</span>
                        </span>
                    </label>
                    <div class="assignment-field-wrapper">
                        <input type="text" id="Action" maxlength="100" required>
                    </div>

                    <div></div>

                    <label for="ActionDate">
                        Action Date <span class="required">*</span>
                        <span class="info-icon">ⓘ
                            <span class="tooltip">Date and time the action occurred.</span>
                        </span>
                    </label>
                    <input type="datetime-local"
                           id="ActionDate"
                           step="1"
                           required>

                </div>

                <div class="button-container">
                    <button type="button" class="btn save-btn">Save</button>
                    <button type="button" class="btn nav-btn prevButton">◀</button>
                    <button type="button" class="btn nav-btn nextButton">▶</button>
                    <button type="button" class="btn exit-btn">Exit</button>
                </div>

            </div>
        </div>
    </div>
</div>
    <script src="js/db-api.js"></script>
    <script src="js/audit-log.js"></script>
</body>

</html>
