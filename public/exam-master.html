<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/reuseable-design.css">
<title>Tuition Centre System</title>
</head>

<body>

<div class="content">

    <div class="main">

        <div class="form">

            <div class="main-title">
                Tuition Centre System
            </div>

            <div class="sub-title">
                Exam Master
            </div>

            <div id="statusMessage" class="status-message"></div>

            <!-- Row 1 -->
            <div class="stackinputs">

                <label for="ExamID" class="assignment-id-label">
                    Exam ID <span class="required">*</span>
                    <span class="info-icon">ⓘ
                        <span class="tooltip">Enter an existing exam ID.</span>
                    </span>
                </label>

                <div class="id-find-group">

                    <input class="short-input"
                           type="number"
                           id="ExamID"
                           readonly
                           required>

                    <div class="assignment-mode-toggle">

                        <button type="button"
                                class="assignment-mode-btn active"
                                id="newModeBtn">
                            New
                        </button>

                        <button type="button"
                                class="assignment-mode-btn"
                                id="findModeBtn">
                            Find
                        </button>

                    </div>

                </div>

                <div></div>

                <label for="ExamName">
                    Exam Name <span class="required">*</span>
                    <span class="info-icon">ⓘ
                        <span class="tooltip">Select the exam name.</span>
                    </span>
                </label>
                <select id="ExamName" required>
                    <option value="">--Select--</option>
                </select>

            </div>

            <!-- Row 2 -->
            <div class="stackinputs">

                <label for="CourseID">
                    Course <span class="required">*</span>
                    <span class="info-icon">ⓘ
                        <span class="tooltip">Select the associated course.</span>
                    </span>
                </label>
                <select id="CourseID" required>
                    <option value="">Select Course</option>
                </select>

                <div></div>

                <label for="TotalMarks">
                    Total Marks <span class="required">*</span>
                    <span class="info-icon">ⓘ
                        <span class="tooltip">Enter the maximum marks for the exam.</span>
                    </span>
                </label>
                <input type="number" id="TotalMarks" required>

            </div>

            <!-- Row 3 -->
            <div class="stackinputs">

                <label for="ExamDate">
                    Exam Date <span class="required">*</span>
                    <span class="info-icon">ⓘ
                        <span class="tooltip">Select the date of the examination.</span>
                    </span>
                </label>
                <input type="date" id="ExamDate" required>

                <div></div>

                <label></label>
                <input type="text" disabled style="visibility:hidden;">

            </div>

            <div class="button-container">
                <button type="button" class="btn save-btn">Save</button>
                <button type="button" class="btn nav-btn prevButton">◀</button>
                <button type="button" class="btn nav-btn nextButton">▶</button>
                <button type="button" class="btn exit-btn">Exit</button>
            </div>

        </div>

    </div>

</div>

<script src="js/db-api.js"></script>
<script src="js/exam_master.js"></script>

</body>
</html>
